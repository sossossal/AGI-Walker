<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI-Walker Web-Godot 实时控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: scale(1.02);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #e53e3e;
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            background: #dd6b20;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 10px;
        }

        .status-connected {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-disconnected {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-running {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-stopped {
            background: #feebc8;
            color: #7c2d12;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .data-display {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            font-weight: 600;
            color: #555;
            min-width: 150px;
        }

        .data-value {
            color: #667eea;
            text-align: right;
        }

        .telemetry-chart {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .chart-label {
            min-width: 100px;
            font-size: 0.9em;
            color: #555;
        }

        .chart-bar-container {
            flex: 1;
            background: #e2e8f0;
            border-radius: 4px;
            height: 20px;
            margin: 0 10px;
            position: relative;
            overflow: hidden;
        }

        .chart-bar-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .chart-value {
            min-width: 80px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        .message-log {
            background: #1a202c;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .log-message {
            margin-bottom: 6px;
            padding: 4px 0;
        }

        .log-info {
            color: #63b3ed;
        }

        .log-success {
            color: #68d391;
        }

        .log-error {
            color: #fc8181;
        }

        .log-warning {
            color: #fbd38d;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .sidebar h3 {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #555;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .button-group {
                flex-direction: column;
            }

            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AGI-Walker Web-Godot 实时控制</h1>
            <p>远程仿真控制和实时遥测监测系统</p>
        </div>

        <div class="main-grid">
            <!-- 主控制面板 -->
            <div class="card">
                <h2>仿真控制</h2>

                <!-- 连接状态 -->
                <div class="control-section">
                    <div class="section-title">连接状态</div>
                    <div>
                        <span id="connectionStatus" class="status-badge status-disconnected">● 未连接</span>
                        <button class="btn-primary" id="connectBtn" onclick="handleConnect()">连接</button>
                        <button class="btn-danger" id="disconnectBtn" onclick="handleDisconnect()" disabled>断开</button>
                    </div>
                </div>

                <!-- 仿真控制 -->
                <div class="control-section">
                    <div class="section-title">仿真控制</div>
                    <div class="input-group">
                        <input type="number" id="gravityInput" placeholder="重力加速度 (m/s²)" value="9.81" min="-20" max="20" step="0.1">
                        <input type="number" id="timestepInput" placeholder="时间步长 (s)" value="0.01" min="0.001" max="0.1" step="0.001">
                    </div>
                    <div class="button-group">
                        <button class="btn-success" id="startBtn" onclick="handleStartSimulation()" disabled>启动仿真</button>
                        <button class="btn-danger" id="stopBtn" onclick="handleStopSimulation()" disabled>停止仿真</button>
                    </div>
                </div>

                <!-- 参数调整 -->
                <div class="control-section">
                    <div class="section-title">参数调整</div>
                    <div class="input-group">
                        <input type="number" id="speedInput" placeholder="目标速度" value="1.0" min="0" max="10" step="0.1">
                    </div>
                    <button class="btn-primary" onclick="handleUpdateParams()" id="updateParamsBtn" disabled style="width: 100%;">更新参数</button>
                </div>

                <!-- 机器人配置 -->
                <div class="control-section">
                    <div class="section-title">机器人配置</div>
                    <div class="input-group">
                        <select id="robotTemplateSelect">
                            <option value="biped">双足机器人</option>
                            <option value="quadruped">四足机器人</option>
                            <option value="hexapod">六足机器人</option>
                        </select>
                    </div>
                    <button class="btn-primary" onclick="handleLoadRobot()" id="loadRobotBtn" disabled style="width: 100%;">加载机器人</button>
                </div>

                <!-- 诊断 -->
                <div class="control-section">
                    <div class="section-title">诊断工具</div>
                    <button class="btn-warning" onclick="handlePing()" id="pingBtn" disabled>Ping 测试</button>
                    <button class="btn-warning" onclick="clearLogs()" style="width: 100%; margin-top: 10px;">清空日志</button>
                </div>

                <!-- 实时遥测数据 -->
                <div class="control-section">
                    <div class="section-title">实时数据</div>
                    <div class="data-display" id="telemetryData">
                        <div class="data-row">
                            <span class="data-label">状态</span>
                            <span class="data-value">等待连接...</span>
                        </div>
                    </div>
                </div>

                <!-- 与Godot的通信测试 -->
                <div class="control-section">
                    <div class="section-title">通信测试</div>
                    <div class="button-group">
                        <button class="btn-warning" onclick="testDirectConnection()">测试Godot连接</button>
                        <button class="btn-warning" onclick="showProtocolInfo()">协议信息</button>
                    </div>
                </div>
            </div>

            <!-- 侧边栏 -->
            <div class="sidebar">
                <h3>📊 系统状态</h3>

                <div class="stat-item">
                    <span class="stat-label">连接状态</span>
                    <span class="stat-value" id="sidebarConnected">未连接</span>
                </div>

                <div class="stat-item">
                    <span class="stat-label">仿真运行</span>
                    <span class="stat-value" id="sidebarSimulating">否</span>
                </div>

                <div class="stat-item">
                    <span class="stat-label">消息计数</span>
                    <span class="stat-value" id="sidebarMessageCount">0</span>
                </div>

                <div class="stat-item">
                    <span class="stat-label">待处理请求</span>
                    <span class="stat-value" id="sidebarPendingRequests">0</span>
                </div>

                <div class="stat-item">
                    <span class="stat-label">遥测更新</span>
                    <span class="stat-value" id="sidebarTelemetryUpdates">0</span>
                </div>

                <div class="stat-item">
                    <span class="stat-label">错误计数</span>
                    <span class="stat-value" id="sidebarErrors">0</span>
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #667eea;">
                    <h3 style="font-size: 1em; margin-bottom: 10px;">⚡ 性能指标</h3>

                    <div class="chart-bar">
                        <span class="chart-label">速度</span>
                        <div class="chart-bar-container">
                            <div class="chart-bar-fill" id="speedBar" style="width: 0%;"></div>
                        </div>
                        <span class="chart-value" id="speedValue">0 m/s</span>
                    </div>

                    <div class="chart-bar">
                        <span class="chart-label">高度</span>
                        <div class="chart-bar-container">
                            <div class="chart-bar-fill" id="heightBar" style="width: 0%;"></div>
                        </div>
                        <span class="chart-value" id="heightValue">0 m</span>
                    </div>

                    <div class="chart-bar">
                        <span class="chart-label">FPS</span>
                        <div class="chart-bar-container">
                            <div class="chart-bar-fill" id="fpsBar" style="width: 0%;"></div>
                        </div>
                        <span class="chart-value" id="fpsValue">0 fps</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息日志 -->
        <div class="card full-width">
            <h2>📝 系统日志</h2>
            <div class="message-log" id="messageLog">
                <div class="log-message log-info">[系统] Web-Godot 控制面板已启动</div>
            </div>
        </div>
    </div>

    <script src="/static/js/web-godot-client.js"></script>
    <script>
        // 全局客户端实例
        let webGodotClient = null;
        const GODOT_CONTROL_SESSION_ID = new URLSearchParams(window.location.search).get('session') || 'web_control_1';
        let godotCapabilities = null;
        let statsData = {
            telemetryUpdates: 0,
            messageCount: 0,
            pendingRequests: 0,
            errors: 0,
            isSimulating: false,
            clientConnected: false
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[UI] 初始化 Web-Godot 控制面板');
            if (GODOT_CONTROL_SESSION_ID !== 'web_control_1') {
                document.title = `AGI-Walker Web-Godot 实时控制 (${GODOT_CONTROL_SESSION_ID})`;
            }
            await loadCapabilities();
        });

        async function loadCapabilities() {
            try {
                const response = await fetch('/api/godot/capabilities');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                godotCapabilities = await response.json();
                addLog(`[模式] 当前页面会话: ${GODOT_CONTROL_SESSION_ID}`, 'info');
                addLog('[模式] 当前页面使用 canonical WebSocket 命令协议', 'info');
                addLog(
                    `[模式] Push 消息统一为 ${godotCapabilities.modes.legacy_controller.push_messages.join(', ')}`,
                    'info',
                );
            } catch (error) {
                addLog(`[警告] 无法读取 Godot capabilities: ${error.message}`, 'warning');
            }
        }

        // 日志输出函数
        function addLog(message, type = 'info') {
            const log = document.getElementById('messageLog');
            const timestamp = new Date().toLocaleTimeString();
            const className = `log-message log-${type}`;
            const logElement = document.createElement('div');
            logElement.className = className;
            logElement.textContent = `[${timestamp}] ${message}`;
            log.appendChild(logElement);
            log.scrollTop = log.scrollHeight;

            if (type === 'error') {
                statsData.errors++;
                document.getElementById('sidebarErrors').textContent = statsData.errors;
            }
        }

        // 连接处理
        async function handleConnect() {
            if (webGodotClient) {
                addLog('[控制] 已存在客户端连接', 'warning');
                return;
            }

            addLog('[控制] 正在连接到服务器...', 'info');

            webGodotClient = new WebGodotClient(GODOT_CONTROL_SESSION_ID);
            webGodotClient.setBaseUrl('ws://127.0.0.1:8000');

            // 注册事件
            webGodotClient
                .onConnected(() => {
                    addLog('[连接] 已连接到 WebSocket 服务器', 'success');
                    addLog('[提示] 这不等于已连接到 Godot 进程，Godot 仍需通过后端控制器建立连接', 'info');
                    statsData.clientConnected = true;
                    updateConnectionUI(true);
                })
                .onDisconnected(() => {
                    addLog('[连接] 已断开连接', 'warning');
                    statsData.clientConnected = false;
                    updateConnectionUI(false);
                })
                .onTelemetry((data) => {
                    statsData.telemetryUpdates++;
                    document.getElementById('sidebarTelemetryUpdates').textContent = statsData.telemetryUpdates;
                    updateTelemetryDisplay(data);
                })
                .onStatus((status) => {
                    addLog(`[状态] ${status.status}`, 'info');
                })
                .onError((error) => {
                    addLog(`[错误] ${error}`, 'error');
                });

            try {
                await webGodotClient.connect();
            } catch (error) {
                addLog(`[错误] 连接失败: ${error.message}`, 'error');
                webGodotClient = null;
            }
        }

        function handleDisconnect() {
            if (webGodotClient) {
                webGodotClient.disconnect();
                webGodotClient = null;
            }
        }

        // UI 更新
        function updateConnectionUI(connected) {
            const btns = {
                connectBtn: !connected,
                disconnectBtn: connected,
                startBtn: connected,
                stopBtn: connected,
                loadRobotBtn: connected,
                updateParamsBtn: connected,
                pingBtn: connected
            };

            for (const [id, enabled] of Object.entries(btns)) {
                document.getElementById(id).disabled = !enabled;
            }

            const badge = document.getElementById('connectionStatus');
            badge.className = 'status-badge ' + (connected ? 'status-connected' : 'status-disconnected');
            badge.textContent = (connected ? '● 已连接 (WebSocket)' : '● 未连接');
            document.getElementById('sidebarConnected').textContent = connected ? 'WebSocket 已连' : '未连接';
        }

        // 命令处理
        async function handleStartSimulation() {
            if (!webGodotClient) return;

            const gravity = parseFloat(document.getElementById('gravityInput').value) || 9.81;
            const timestep = parseFloat(document.getElementById('timestepInput').value) || 0.01;

            try {
                await webGodotClient.startSimulation({ gravity, timestep });
                statsData.isSimulating = true;
                document.getElementById('sidebarSimulating').textContent = '是';
                addLog('[启动] 仿真已启动', 'success');
            } catch (error) {
                addLog(`[错误] 启动仿真失败: ${error.message}`, 'error');
            }
        }

        async function handleStopSimulation() {
            if (!webGodotClient) return;

            try {
                await webGodotClient.stopSimulation();
                statsData.isSimulating = false;
                document.getElementById('sidebarSimulating').textContent = '否';
                addLog('[停止] 仿真已停止', 'success');
            } catch (error) {
                addLog(`[错误] 停止仿真失败: ${error.message}`, 'error');
            }
        }

        async function handleLoadRobot() {
            if (!webGodotClient) return;

            const template = document.getElementById('robotTemplateSelect').value;
            const config = {
                template: template,
                parts: [],
                connections: []
            };

            try {
                await webGodotClient.loadRobotConfig(config);
                addLog(`[加载] ${template} 机器人配置已加载`, 'success');
            } catch (error) {
                addLog(`[错误] 加载机器人失败: ${error.message}`, 'error');
            }
        }

        async function handleUpdateParams() {
            if (!webGodotClient) return;

            const speed = parseFloat(document.getElementById('speedInput').value) || 1.0;
            const params = { target_speed: speed };

            try {
                await webGodotClient.updateParams(params);
                addLog('[更新] 参数已更新', 'success');
            } catch (error) {
                addLog(`[错误] 参数更新失败: ${error.message}`, 'error');
            }
        }

        async function handlePing() {
            if (!webGodotClient) return;

            try {
                const start = Date.now();
                await webGodotClient.ping();
                const latency = Date.now() - start;
                addLog(`[Ping] 延时: ${latency}ms`, 'success');
            } catch (error) {
                addLog(`[错误] Ping 失败: ${error.message}`, 'error');
            }
        }

        // 数据显示
        function updateTelemetryDisplay(data) {
            if (!data) return;

            const display = document.getElementById('telemetryData');
            let html = '';

            // 基本信息
            if (data.simulation_time !== undefined) {
                html += `<div class="data-row"><span class="data-label">仿真时间</span><span class="data-value">${data.simulation_time.toFixed(2)}s</span></div>`;
            }

            // 位置信息
            if (data.position) {
                const pos = data.position;
                html += `<div class="data-row"><span class="data-label">位置 X</span><span class="data-value">${pos.x?.toFixed(3) || 0}m</span></div>`;
                html += `<div class="data-row"><span class="data-label">位置 Y</span><span class="data-value">${pos.y?.toFixed(3) || 0}m</span></div>`;
                html += `<div class="data-row"><span class="data-label">位置 Z</span><span class="data-value">${pos.z?.toFixed(3) || 0}m</span></div>`;
            }

            // 传感器数据
            if (data.sensors) {
                if (data.sensors.speed !== undefined) {
                    html += `<div class="data-row"><span class="data-label">速度</span><span class="data-value">${data.sensors.speed.toFixed(2)} m/s</span></div>`;
                    updateSpeedBar(data.sensors.speed);
                }
                if (data.sensors.height !== undefined) {
                    html += `<div class="data-row"><span class="data-label">高度</span><span class="data-value">${data.sensors.height.toFixed(2)} m</span></div>`;
                    updateHeightBar(data.sensors.height);
                }
            }

            // 仿真状态
            if (data.simulation_status) {
                if (data.simulation_status.fps !== undefined) {
                    html += `<div class="data-row"><span class="data-label">FPS</span><span class="data-value">${data.simulation_status.fps.toFixed(1)}</span></div>`;
                    updateFpsBar(data.simulation_status.fps);
                }
            }

            display.innerHTML = html || '<div class="data-row"><span class="data-label">状态</span><span class="data-value">等待数据...</span></div>';
        }

        function updateSpeedBar(speed) {
            const percentage = Math.min(100, (speed / 5) * 100);
            document.getElementById('speedBar').style.width = percentage + '%';
            document.getElementById('speedValue').textContent = speed.toFixed(2) + ' m/s';
        }

        function updateHeightBar(height) {
            const percentage = Math.min(100, (height / 2) * 100);
            document.getElementById('heightBar').style.width = percentage + '%';
            document.getElementById('heightValue').textContent = height.toFixed(2) + ' m';
        }

        function updateFpsBar(fps) {
            const percentage = Math.min(100, (fps / 60) * 100);
            document.getElementById('fpsBar').style.width = percentage + '%';
            document.getElementById('fpsValue').textContent = fps.toFixed(0) + ' fps';
        }

        // 工具函数
        function clearLogs() {
            document.getElementById('messageLog').innerHTML = '<div class="log-message log-info">[系统] 日志已清空</div>';
        }

        function testDirectConnection() {
            addLog('[测试] 开始尝试直接连接Godot...', 'info');
            // 这会在后续实现
            addLog('[测试] 功能待实现', 'warning');
        }

        function showProtocolInfo() {
            const info = `
Web-Godot 协议 v1.0 信息:
- 消息格式: JSON
- 当前页面模式: Canonical WebSocket command channel
- 会话: ${GODOT_CONTROL_SESSION_ID}
- 命令: simulation.start/stop, config.load_robot, params.update, ping
- 推送: telemetry.update, simulation.status, simulation.error, connection.status
- ID 匹配用于请求-响应关联
- 仅支持 canonical 消息名
- Session Bridge: 独立会话接口，用于 launch/status/control 和 TCP 遥测桥
- 自动重连: 启用 (最多5次尝试)
            `;
            addLog(info, 'info');
        }

        // 状态更新
        setInterval(() => {
            if (webGodotClient) {
                const status = webGodotClient.getConnectionStatus();
                document.getElementById('sidebarMessageCount').textContent = status.messageCount || 0;
                document.getElementById('sidebarPendingRequests').textContent = status.pendingRequests || 0;
            }
        }, 1000);
    </script>
</body>
</html>
