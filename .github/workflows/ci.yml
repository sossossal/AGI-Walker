name: AGI-Walker CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Check (Linting)
  # -----------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff (Lint)
        run: ruff check agi_walker/ python_api/ python_controller/ --ignore E501,F401

      - name: Check Formatting (Black)
        run: black --check --diff agi_walker/ python_api/ python_controller/ examples/

  # -----------------------------------------------------------------------------
  # Job 2: Unit Tests (Multi-OS)
  # -----------------------------------------------------------------------------
  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 核心测试插件
          pip install pytest pytest-mock stable-baselines3 gymnasium lxml
          # scipy: 用于 Skills/parameter-optimizer 完整工作流测试
          pip install scipy

      # 调试: 找出哪个测试文件导致导入阶段崩溃 (Exit Code 2 根因)
      - name: Debug Test Collection
        run: python debug_collection.py

      # 运行核心测试
      - name: Run Unit Tests
        run: pytest tests/ -v --tb=short

      # 简单的 Import Smoke Test
      - name: Smoke Test - CLI Imports
        run: |
          python -c "import agi_walker; print('agi_walker loaded')"
          python -c "import gymnasium; print('gymnasium loaded')"

  # -----------------------------------------------------------------------------
  # Job 3: Integration & Specialized Tests
  # -----------------------------------------------------------------------------
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest stable-baselines3 gymnasium

      # 运行带有 integration 标记的慢速测试
      - name: Run Integration Tests
        run: pytest tests/ -m integration -v

  # -----------------------------------------------------------------------------
  # Job 4: Release Readiness
  # -----------------------------------------------------------------------------
  release-check:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version Check
        run: |
          echo "Release Candidate Ready"
          if [ -f "VERSION" ]; then
            echo "Version: $(cat VERSION)"
          else
            echo "::warning::VERSION file missing"
          fi
