name: AGI-Walker CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Check (Linting)
  # -----------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff (Lint)
        run: ruff check agi_walker/ python_api/ python_controller/ --ignore E501,F401

      - name: Check Formatting (Black)
        run: black --check --diff agi_walker/ python_api/ python_controller/ examples/

  # -----------------------------------------------------------------------------
  # Job 2: Unit Tests (Multi-OS)
  # -----------------------------------------------------------------------------
  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock stable-baselines3 gymnasium lxml

      # 运行核心测试并生成覆盖率报告
      - name: Run Unit Tests with Coverage
        env:
          PYTEST_ADDOPTS: "--cov=agi_walker --cov-report=xml"
        run: pytest tests/ --tb=short

      # 简单的 Import Smoke Test (确保环境至少能从命令行加载)
      - name: Smoke Test - CLI Imports
        run: |
          python -c "import agi_walker; print('agi_walker loaded')"
          python -c "import gymnasium; print('gymnasium loaded')"

      # 上传覆盖率 (只在 Ubuntu/3.11 上传一次即可)
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # -----------------------------------------------------------------------------
  # Job 3: Integration & Specialized Tests
  # -----------------------------------------------------------------------------
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest stable-baselines3 gymnasium

      # 运行带有 integration 标记的慢速测试
      - name: Run Integration Tests
        run: pytest tests/ -m integration -v

      # 验证示例脚本是否可运行 (Regression Check)
      - name: Verify Key Examples
        run: |
          python examples/skills_demo.py
          # 这里可以添加更多关键示例的 dry-run

  # -----------------------------------------------------------------------------
  # Job 4: Release Readiness
  # -----------------------------------------------------------------------------
  release-check:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version Check
        run: |
          echo "Release Candidate Ready"
          if [ -f "VERSION" ]; then
            echo "Version: $(cat VERSION)"
          else
            echo "::warning::VERSION file missing"
          fi
