name: AGI-Walker CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Check (Linting)
  # -----------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff (Lint)
        run: ruff check agi_walker/ python_api/ python_controller/ --ignore E501,F401

      - name: Check Formatting (Black)
        run: black --check --diff agi_walker/ python_api/ python_controller/ examples/

  # -----------------------------------------------------------------------------
  # Job 2: Unit Tests (Multi-OS)
  # -----------------------------------------------------------------------------
  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock stable-baselines3 gymnasium lxml scipy pytest-cov

      - name: Run Unit Tests
        run: pytest tests/ -m "not integration and not hardware" -v --tb=short --cov=agi_walker --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        run: |
          pip install codecov --quiet
          codecov --file coverage.xml --flags unittests || echo "codecov upload skipped"

      - name: Smoke Test - CLI Imports
        run: |
          python -c "import agi_walker; print('agi_walker loaded')"
          python -c "import gymnasium; print('gymnasium loaded')"

      - name: Validate Skills & Check Assets
        run: |
          export PYTHONPATH=${GITHUB_WORKSPACE}
          python python_api/tools/validate_skills.py

  # -----------------------------------------------------------------------------
  # Job 3: Integration & Specialized Tests
  # -----------------------------------------------------------------------------
  integration:
    needs: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock stable-baselines3 gymnasium

      - name: Run Integration Tests
        run: pytest tests/ -m integration -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379

  # -----------------------------------------------------------------------------
  # Job 4: Release Readiness
  # -----------------------------------------------------------------------------
  release-check:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version Check
        run: |
          echo "Release Candidate Ready"
          if [ -f "VERSION" ]; then
            echo "Version: $(cat VERSION)"
          else
            echo "::warning::VERSION file missing"
          fi
