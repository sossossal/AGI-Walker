name: AGI-Walker CI/CD

on:
  push:
    branches: [main, develop, ci/day2-7-quality-gates]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Check (Linting)
  # -----------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff (Lint)
        run: ruff check agi_walker/ python_api/ python_controller/ --ignore E501,F401

      - name: Check Formatting (Black)
        run: black --check --diff agi_walker/ python_api/ python_controller/ examples/

  # -----------------------------------------------------------------------------
  # Job 2: Unit Tests (Multi-OS)
  # -----------------------------------------------------------------------------
  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 核心测试插件
          pip install pytest pytest-mock stable-baselines3 gymnasium lxml
          # scipy: 用于 Skills/parameter-optimizer 完整工作流测试
          pip install scipy
          # 覆盖率插件（仅 CI 环境安装）
          pip install pytest-cov

      # 调试: 找出哪个测试文件导致导入阶段崩溃（失败不阻断主流程）
      - name: Debug Test Collection
        continue-on-error: true
        run: python debug_collection.py

      # ★ 核心单元测试 —— 必须硬失败，不得使用 || true 或 continue-on-error
      # -m 过滤掉需要外部服务的 integration/hardware 测试
      - name: Run Unit Tests
        run: pytest tests/ -m "not integration and not hardware" -v --tb=short --cov=agi_walker --cov-report=xml --cov-report=term-missing


      # 覆盖率上传：网络或 token 问题不应阻断 CI
      - name: Upload Coverage
        continue-on-error: true
        run: |
          pip install codecov --quiet
          codecov --file coverage.xml --flags unittests || echo "codecov upload skipped"

      # 简单的 Import Smoke Test
      - name: Smoke Test - CLI Imports
        run: |
          python -c "import agi_walker; print('agi_walker loaded')"
          python -c "import gymnasium; print('gymnasium loaded')"

  # -----------------------------------------------------------------------------
  # Job 3: Integration & Specialized Tests
  # -----------------------------------------------------------------------------
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock stable-baselines3 gymnasium

      # 运行带有 integration 标记的测试（允许失败：键可能无外部服务）
      - name: Run Integration Tests
        continue-on-error: true
        run: pytest tests/ -m integration -v --tb=short


  # -----------------------------------------------------------------------------
  # Job 4: Release Readiness
  # -----------------------------------------------------------------------------
  release-check:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version Check
        run: |
          echo "Release Candidate Ready"
          if [ -f "VERSION" ]; then
            echo "Version: $(cat VERSION)"
          else
            echo "::warning::VERSION file missing"
          fi
