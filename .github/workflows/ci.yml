name: AGI-Walker CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}
  AGI_WALKER_WEB_RUNS_PAGE_SIZE: "20"
  AGI_WALKER_WEB_RUNS_MAX_PAGE_SIZE: "100"
  AGI_WALKER_WEB_ARCHIVE_MAX_RUNS: "200"
  AGI_WALKER_WEB_ARCHIVE_MAX_AGE_DAYS: "30"

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Quality Check (Linting)
  # -----------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      # Native Node 24 actions - No environment flags needed
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff (Lint)
        run: ruff check agi_walker/ --ignore E501,F401

      - name: Check Formatting (Black)
        run: black --check --diff agi_walker/ examples/

  # -----------------------------------------------------------------------------
  # Job 2: Minimal Smoke Tests
  # -----------------------------------------------------------------------------
  smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Smoke Tests
        run: python tests/run_smoke_tests.py --output-root test_env/smoke_ci

      - name: Upload Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: test_env/smoke_ci
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------------------
  # Job 2b: Distributed Smoke (manual trigger only)
  # -----------------------------------------------------------------------------
  distributed-smoke:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          

      - name: Install distributed-smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,training]"
          pip install fastapi uvicorn

      - name: Check Docker Engine
        run: |
          docker version
          docker compose version

      - name: Run Distributed Smoke Test
        run: python tests/run_distributed_smoke.py --build --stop-after --report-file test_env/distributed_smoke/distributed_smoke_report.json

      - name: Upload Distributed Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-smoke-artifacts
          path: test_env/distributed_smoke
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------------------
  # Job 2c: Real Godot Headless Smoke (manual trigger only)
  # -----------------------------------------------------------------------------
  godot-headless-smoke:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    env:
      AGI_WALKER_ENABLE_GODOT_HEADLESS_SMOKE: "1"
      AGI_WALKER_GODOT_HEADLESS_ARTIFACT_DIR: "test_env/godot_headless_smoke"
      AGI_WALKER_GODOT_HEADLESS_SCENE: "demo_generated_biped.tscn"
      AGI_WALKER_GODOT_HEADLESS_CONNECT_TIMEOUT_SECONDS: "20"
      AGI_WALKER_GODOT_HEADLESS_SCHEMA_TIMEOUT_SECONDS: "12"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          

      - name: Install headless-smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,training]"
          pip install pytest pytest-asyncio fastapi uvicorn

      - name: Run Real Godot Headless Smoke
        run: python -m pytest tests/test_godot_headless_smoke.py -q -m "integration and live" --tb=short -vv

      - name: Upload Headless Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-headless-smoke-artifacts
          path: test_env/godot_headless_smoke
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------------------
  # Job 2d: ROS2 Bridge Smoke (manual trigger only)
  # -----------------------------------------------------------------------------
  ros2-bridge-smoke:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      AGI_WALKER_ENABLE_ROS2_BRIDGE_SMOKE: "1"
      AGI_WALKER_ROS2_BRIDGE_SMOKE_ARTIFACT_DIR: "test_env/ros2_bridge_smoke"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.10"

      - name: Install ROS2 Humble runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y ros-humble-ros-base python3-colcon-common-extensions

      - name: Install ros2-bridge-smoke dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,training]"

      - name: Run ROS2 Bridge Smoke
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python -m pytest tests/test_ros2_bridge_smoke.py -q -m "integration and live" --tb=short -vv

      - name: Upload ROS2 Bridge Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-bridge-smoke-artifacts
          path: test_env/ros2_bridge_smoke
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------------------
  # Job 3: Unit Tests (Multi-OS)
  # -----------------------------------------------------------------------------
  test:
    if: github.event_name != 'schedule'
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,training]"
          pip install pytest pytest-mock stable-baselines3 gymnasium lxml scipy pytest-cov

      - name: Run Unit Tests
        run: pytest tests/ -m "not integration and not hardware" -v --tb=short --cov=agi_walker --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        run: |
          pip install codecov --quiet
          codecov --file coverage.xml --flags unittests || echo "codecov upload skipped"

  # -----------------------------------------------------------------------------
  # Job 4: Integration & Specialized Tests
  # -----------------------------------------------------------------------------
  integration:
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,training]"
          pip install pytest pytest-mock stable-baselines3 gymnasium

      # 鏉╂劘顢戠敮锔芥箒 integration 閺嶅洩顔囬惃鍕ゴ鐠?
      - name: Run Integration Tests
        run: pytest tests/ -m integration -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379

  # -----------------------------------------------------------------------------
  # Job 5: Release Readiness
  # -----------------------------------------------------------------------------
  release-check:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Version Check
        run: |
          echo "Release Candidate Ready"
          if [ -f "VERSION" ]; then
            echo "Version: $(cat VERSION)"
          else
            echo "::warning::VERSION file missing"
          fi
