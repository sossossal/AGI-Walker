name: Godot Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
  # ✅ 消除 Node.js 20 弃用警告，强制所有 JS Action 在 Node 24 下运行
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    test:
        name: Run Godot Tests
        runs-on: ubuntu-latest
        container:
            image: barichello/godot-ci:4.2.1
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Run Tests
              run: |
                  godot --headless --script godot_project/run_tests.gd
