name: Godot Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
  # ✅ 专业静默：消除弃用警告
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
    test:
        name: Run Godot Tests
        runs-on: ubuntu-latest
        container:
            image: barichello/godot-ci:4.2.1
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2

            - name: Run Tests
              run: |
                  godot --headless --script godot_project/run_tests.gd
