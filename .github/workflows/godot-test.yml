name: Godot Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
  # ✅ 兼容 Node.js 24 (2026年6月后的强制运行环境)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    test:
        name: Run Godot Tests
        runs-on: ubuntu-latest
        container:
            image: barichello/godot-ci:4.2.1
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Tests
              run: |
                  godot --headless --script godot_project/run_tests.gd
