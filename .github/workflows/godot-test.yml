name: Godot Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        name: Run Godot Tests
        runs-on: ubuntu-latest
        container:
            image: barichello/godot-ci:4.2.1
        steps:
            - name: Checkout Code
              uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # main branch (Node 24 native)

            - name: Run Tests
              run: |
                  godot --headless --script godot_project/run_tests.gd
