[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-walker"
version = "3.0.0"
description = "AGI-Walker: A Distributed Embodied Intelligence Platform for Robot Design and Simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AGI-Walker Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "eclipse-zenoh>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.7",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "python-json-logger>=2.0.7",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
hardware = [
    "python-can>=4.0.0",
    "mujoco>=3.0.0",
    "PyQt6>=6.0.0",
]
training = [
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
    "imitation>=1.0.0",
    "d3rlpy>=2.0.0",
    "onnx>=1.12.0",
    "onnxruntime>=1.13.0",
    "onnx-simplifier>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agi_walker*", "web_panel*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=agi_walker"
testpaths = ["tests"]
