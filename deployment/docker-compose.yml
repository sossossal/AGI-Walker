version: '3.8'

services:
  # Zenoh Router (Central Message Broker)
  zenoh-router:
    image: eclipse/zenoh:1.0.0
    ports:
      - "7447:7447"  # TCP Peering
      - "8000:8000"  # HTTP/REST
    command: ["--config", "/dev/null", "--listen", "tcp/0.0.0.0:7447"]

  # Learner (Central Node)
  learner:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["python", "-u", "distributed/run_learner.py"]
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
    # Connect to Router
    # We might need to adjust run_learner.py to accept zenoh router address arg

  # Sidecar (Edge Node - runs next to Godot)
  # In this simulation, we run it in Docker but connect to Host Godot
  sidecar-1:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["python", "-u", "distributed/sidecar.py", "--id", "actor_docker_1", "--godot-host", "host.docker.internal"]
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allow access to Windows Host Godot
