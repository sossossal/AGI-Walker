services:
  # Zenoh Router (Central Message Broker)
  zenoh-router:
    image: eclipse/zenoh:1.0.0
    ports:
      - "7447:7447"  # TCP Peering
      - "8000:8000"  # HTTP/REST
    command: ["--config", "/dev/null", "--listen", "tcp/0.0.0.0:7447"]

  # Learner (Central Node)
  learner:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command: ["python", "-u", "distributed/run_learner.py"]
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ZENOH_ROUTER=tcp/zenoh-router:7447

  # Sidecar (Edge Node - runs next to Godot)
  # By default this connects to host.docker.internal, but smoke tests can override
  # AGI_WALKER_GODOT_HOST and AGI_WALKER_SIDECAR_ACTOR_ID.
  sidecar-1:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command:
      - python
      - -u
      - distributed/sidecar.py
      - --id
      - ${AGI_WALKER_SIDECAR_ACTOR_ID:-actor_docker_1}
      - --godot-host
      - ${AGI_WALKER_GODOT_HOST:-host.docker.internal}
      - --zenoh-router
      - tcp/zenoh-router:7447
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allow access to Windows Host Godot

  mock-godot:
    profiles: ["smoke"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command:
      - python
      - -u
      - tests/mock_distributed_godot_server.py
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --actor-id
      - ${AGI_WALKER_SIDECAR_ACTOR_ID:-actor_docker_1}
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

  # Web Panel / Workflow Control Plane
  web-panel:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web_panel
      args:
        WEB_PANEL_APT_PACKAGES: ""
        WEB_PANEL_REQUIREMENTS_FILE: /app/deployment/requirements.web_panel.txt
    command: ["python", "-m", "uvicorn", "web_panel.server:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - zenoh-router
    env_file:
      - ./web_panel.env.example
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_ZENOH_ENDPOINT=tcp/zenoh-router:7447
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/status', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Web Panel / Distributed-capable variant (optional, installs zenoh Python package)
  web-panel-distributed:
    profiles: ["distributed"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web_panel
      args:
        WEB_PANEL_APT_PACKAGES: build-essential
        WEB_PANEL_REQUIREMENTS_FILE: /app/deployment/requirements.web_panel.distributed.txt
    image: deployment-web-panel-distributed
    command: ["python", "-m", "uvicorn", "web_panel.server:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - zenoh-router
    env_file:
      - ./web_panel.env.example
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_ZENOH_ENDPOINT=tcp/zenoh-router:7447
    ports:
      - "8081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/status', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
