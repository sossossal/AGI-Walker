services:
  redis:
    image: redis:7-alpine
    ports:
      - "${AGI_WALKER_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Zenoh Router (Central Message Broker)
  zenoh-router:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.zenoh_router
      args:
        ZENOH_BASE_IMAGE: ${AGI_WALKER_ZENOH_BASE_IMAGE:-eclipse/zenoh:1.9.0}
    image: ${AGI_WALKER_ZENOH_IMAGE:-deployment-zenoh-router}
    ports:
      - "${AGI_WALKER_ZENOH_TCP_PORT:-7447}:7447"  # TCP Peering
      - "${AGI_WALKER_ZENOH_REST_PORT:-8000}:8000"  # HTTP/REST
    command: ["--config", "/dev/null", "--listen", "tcp/0.0.0.0:7447"]

  # Learner (Central Node)
  learner:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command: ["python", "-u", "-m", "agi_walker.core.distributed.run_learner"]
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ZENOH_ROUTER=tcp/zenoh-router:7447

  # Sidecar (Edge Node - runs next to Godot)
  # By default this connects to host.docker.internal, but smoke tests can override
  # AGI_WALKER_GODOT_HOST and AGI_WALKER_SIDECAR_ACTOR_ID.
  sidecar-1:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command:
      - python
      - -u
      - -m
      - agi_walker.core.distributed.sidecar
      - --id
      - ${AGI_WALKER_SIDECAR_ACTOR_ID:-actor_docker_1}
      - --godot-host
      - ${AGI_WALKER_GODOT_HOST:-host.docker.internal}
      - --godot-port
      - ${AGI_WALKER_GODOT_PORT:-9000}
      - --zenoh-router
      - tcp/zenoh-router:7447
    depends_on:
      - zenoh-router
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_FORCE_OFFLOAD=${AGI_WALKER_FORCE_OFFLOAD:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allow access to Windows Host Godot

  mock-godot:
    profiles: ["smoke"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.distributed_runtime
    command:
      - python
      - -u
      - tests/mock_distributed_godot_server.py
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --actor-id
      - ${AGI_WALKER_SIDECAR_ACTOR_ID:-actor_docker_1}
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

  # Web Panel / Workflow Control Plane
  web-panel:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web_panel
      args:
        WEB_PANEL_BASE_IMAGE: ${AGI_WALKER_WEB_PANEL_BASE_IMAGE:-python:3.11-alpine}
        WEB_PANEL_APT_PACKAGES: ""
        WEB_PANEL_APK_PACKAGES: ${AGI_WALKER_WEB_PANEL_APK_PACKAGES:-libgcc}
        WEB_PANEL_REQUIREMENTS_FILE: /app/deployment/requirements.web_panel.txt
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn web_panel.server:app --host 0.0.0.0 --port 8000"]
    depends_on:
      - redis
      - zenoh-router
    env_file:
      - ${AGI_WALKER_COMPOSE_WEB_ENV_FILE:-./web_panel.env.example}
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_SECRET_KEY=${AGI_WALKER_SECRET_KEY:-change-me-before-production}
      - AGI_WALKER_ZENOH_ENDPOINT=tcp/zenoh-router:7447
      - AGI_WALKER_DATABASE_URL=${AGI_WALKER_DATABASE_URL:-sqlite+aiosqlite:////var/lib/agi_walker/db/agi_walker.db}
      - AGI_WALKER_WEB_OUTPUT_ROOT=${AGI_WALKER_WEB_OUTPUT_ROOT:-/var/lib/agi_walker/workflow_runs}
      - AGI_WALKER_WEB_ARCHIVE_ROOT=${AGI_WALKER_WEB_ARCHIVE_ROOT:-/var/lib/agi_walker/workflow_archive}
      - AGI_WALKER_REDIS_URL=${AGI_WALKER_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${AGI_WALKER_WEB_PORT:-8080}:8000"
    volumes:
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/db:/var/lib/agi_walker/db"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_runs:/var/lib/agi_walker/workflow_runs"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_archive:/var/lib/agi_walker/workflow_archive"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/backups:/var/lib/agi_walker/backups"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/status', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  workflow-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web_panel
      args:
        WEB_PANEL_BASE_IMAGE: ${AGI_WALKER_WEB_PANEL_BASE_IMAGE:-python:3.11-alpine}
        WEB_PANEL_APT_PACKAGES: ""
        WEB_PANEL_APK_PACKAGES: ${AGI_WALKER_WEB_PANEL_APK_PACKAGES:-libgcc}
        WEB_PANEL_REQUIREMENTS_FILE: /app/deployment/requirements.web_panel.txt
    command: ["celery", "-A", "web_panel.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      - redis
      - zenoh-router
    env_file:
      - ${AGI_WALKER_COMPOSE_WEB_ENV_FILE:-./web_panel.env.example}
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_SECRET_KEY=${AGI_WALKER_SECRET_KEY:-change-me-before-production}
      - AGI_WALKER_ZENOH_ENDPOINT=tcp/zenoh-router:7447
      - AGI_WALKER_DATABASE_URL=${AGI_WALKER_DATABASE_URL:-sqlite+aiosqlite:////var/lib/agi_walker/db/agi_walker.db}
      - AGI_WALKER_WEB_OUTPUT_ROOT=${AGI_WALKER_WEB_OUTPUT_ROOT:-/var/lib/agi_walker/workflow_runs}
      - AGI_WALKER_WEB_ARCHIVE_ROOT=${AGI_WALKER_WEB_ARCHIVE_ROOT:-/var/lib/agi_walker/workflow_archive}
      - AGI_WALKER_REDIS_URL=${AGI_WALKER_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/db:/var/lib/agi_walker/db"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_runs:/var/lib/agi_walker/workflow_runs"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_archive:/var/lib/agi_walker/workflow_archive"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/backups:/var/lib/agi_walker/backups"

  # Web Panel / Distributed-capable variant (optional, installs zenoh Python package)
  web-panel-distributed:
    profiles: ["distributed"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.web_panel
      args:
        WEB_PANEL_BASE_IMAGE: ${AGI_WALKER_WEB_PANEL_BASE_IMAGE:-python:3.11-alpine}
        WEB_PANEL_APT_PACKAGES: ""
        WEB_PANEL_APK_PACKAGES: ${AGI_WALKER_WEB_PANEL_APK_PACKAGES:-libgcc}
        WEB_PANEL_REQUIREMENTS_FILE: /app/deployment/requirements.web_panel.distributed.txt
    image: deployment-web-panel-distributed
    command: ["python", "-m", "uvicorn", "web_panel.server:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - zenoh-router
    env_file:
      - ${AGI_WALKER_COMPOSE_WEB_ENV_FILE:-./web_panel.env.example}
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - AGI_WALKER_ZENOH_ENDPOINT=tcp/zenoh-router:7447
      - AGI_WALKER_DATABASE_URL=${AGI_WALKER_DATABASE_URL:-sqlite+aiosqlite:////var/lib/agi_walker/db/agi_walker.db}
      - AGI_WALKER_WEB_OUTPUT_ROOT=${AGI_WALKER_WEB_OUTPUT_ROOT:-/var/lib/agi_walker/workflow_runs}
      - AGI_WALKER_WEB_ARCHIVE_ROOT=${AGI_WALKER_WEB_ARCHIVE_ROOT:-/var/lib/agi_walker/workflow_archive}
    ports:
      - "${AGI_WALKER_WEB_DISTRIBUTED_PORT:-8081}:8000"
    volumes:
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/db:/var/lib/agi_walker/db"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_runs:/var/lib/agi_walker/workflow_runs"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/workflow_archive:/var/lib/agi_walker/workflow_archive"
      - "${AGI_WALKER_RUNTIME_ROOT:-./runtime}/backups:/var/lib/agi_walker/backups"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/status', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
