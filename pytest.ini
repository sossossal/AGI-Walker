[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# 基础参数：详情输出 + 简短失败报告
# 覆盖率参数请在 CI 命令中显式指定（见 .github/workflows/ci.yml）
addopts = -v --tb=short -p no:cacheprovider

# 明确排除非测试脚本
norecursedirs = .git .github .vscode .pytest_cache .ruff_cache build dist godot_project robot_models knowledge examples python_api python_controller agi_walker training offline_data models web_panel

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests needing external services (Zenoh/TCP/ROS2/Godot)
    live: marks tests that require opt-in live environments or heavyweight local runtimes
    hardware: marks tests requiring physical hardware (CAN bus etc.)
    unit: marks pure unit tests (no external dependencies)
