[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# 明确排除非测试脚本，防止 pytest 意外收集
norecursedirs = .git .github .vscode .pytest_cache .ruff_cache build dist godot_project robot_models knowledge examples python_api python_controller agi_walker training offline_data models web_panel
python_ignore = verify_*.py validate_*.py benchmark_*.py run_all_tests.py debug_collection.py

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    hardware: marks tests requiring hardware
