[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# 禁用可能导致崩溃的插件，并加速收集
addopts = -p no:cov -p no:warnings --strict-markers

# 明确排除非测试脚本
norecursedirs = .git .github .vscode .pytest_cache .ruff_cache build dist godot_project robot_models knowledge examples python_api python_controller agi_walker training offline_data models web_panel

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    hardware: marks tests requiring hardware
